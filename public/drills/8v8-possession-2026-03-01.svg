  <ellipse cx="680" cy="430" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="355" cy="380" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="555" cy="500" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>

