  <ellipse cx="340" cy="290" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="290" cy="335" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="400" cy="225" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
