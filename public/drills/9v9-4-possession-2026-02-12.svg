      <stop offset="0%" stop-color="#2d6b30"/><stop offset="7.7%" stop-color="#2d6b30"/>
      <stop offset="7.7%" stop-color="#327034"/><stop offset="15.4%" stop-color="#327034"/>
      <stop offset="15.4%" stop-color="#2d6b30"/><stop offset="23.1%" stop-color="#2d6b30"/>
      <stop offset="23.1%" stop-color="#327034"/><stop offset="30.8%" stop-color="#327034"/>
      <stop offset="30.8%" stop-color="#2d6b30"/><stop offset="38.5%" stop-color="#2d6b30"/>
      <stop offset="38.5%" stop-color="#327034"/><stop offset="46.2%" stop-color="#327034"/>
      <stop offset="46.2%" stop-color="#2d6b30"/><stop offset="53.9%" stop-color="#2d6b30"/>
      <stop offset="53.9%" stop-color="#327034"/><stop offset="61.5%" stop-color="#327034"/>
      <stop offset="61.5%" stop-color="#2d6b30"/><stop offset="69.2%" stop-color="#2d6b30"/>
