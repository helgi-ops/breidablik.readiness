      <stop offset="92.3%" stop-color="#2d6b30"/><stop offset="100%" stop-color="#2d6b30"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.4)"/></filter>
  </defs>

  <rect width="820" height="580" rx="8" fill="url(#grass)"/>

  <!-- Faded pitch markings -->
  <rect x="20" y="20" width="780" height="540" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="410" y1="20" x2="410" y2="560" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="410" cy="290" r="58" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="20" y="160" width="95" height="260" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="705" y="160" width="95" height="260" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Large possession zone (diamond-ish rectangle) -->
  <polygon points="180,175 640,175 720,290 640,405 180,405 100,290"
    fill="rgba(255,255,255,0.03)"
    stroke="rgba(255,255,255,0.55)"
    stroke-width="2"
    stroke-dasharray="8,6"/>

  <!-- Title -->
  <text x="410" y="42" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="16" font-weight="700" letter-spacing="0.5">9v9 + 4 possession</text>

