<svg viewBox="0 0 820 580" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d6b30"/><stop offset="7.7%" stop-color="#2d6b30"/>
      <stop offset="7.7%" stop-color="#327034"/><stop offset="15.4%" stop-color="#327034"/>
      <stop offset="15.4%" stop-color="#2d6b30"/><stop offset="23.1%" stop-color="#2d6b30"/>
      <stop offset="23.1%" stop-color="#327034"/><stop offset="30.8%" stop-color="#327034"/>
      <stop offset="30.8%" stop-color="#2d6b30"/><stop offset="38.5%" stop-color="#2d6b30"/>
      <stop offset="38.5%" stop-color="#327034"/><stop offset="46.2%" stop-color="#327034"/>
      <stop offset="46.2%" stop-color="#2d6b30"/><stop offset="53.9%" stop-color="#2d6b30"/>
      <stop offset="53.9%" stop-color="#327034"/><stop offset="61.5%" stop-color="#327034"/>
      <stop offset="61.5%" stop-color="#2d6b30"/><stop offset="69.2%" stop-color="#2d6b30"/>
      <stop offset="69.2%" stop-color="#327034"/><stop offset="76.9%" stop-color="#327034"/>
      <stop offset="76.9%" stop-color="#2d6b30"/><stop offset="84.6%" stop-color="#2d6b30"/>
      <stop offset="84.6%" stop-color="#327034"/><stop offset="92.3%" stop-color="#327034"/>
      <stop offset="92.3%" stop-color="#2d6b30"/><stop offset="100%" stop-color="#2d6b30"/>
    </linearGradient>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.4)"/></filter>
    <pattern id="net" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="5" y2="5" stroke="rgba(255,255,255,0.35)" stroke-width="0.5"/>
      <line x1="5" y1="0" x2="0" y2="5" stroke="rgba(255,255,255,0.35)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="820" height="580" rx="8" fill="url(#grass)"/>

  <!-- Faded pitch markings -->
  <rect x="20" y="20" width="780" height="540" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <line x1="410" y1="20" x2="410" y2="560" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="410" cy="290" r="58" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="20" y="160" width="95" height="260" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="705" y="160" width="95" height="260" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Central breakout zone -->
  <rect x="295" y="175" width="230" height="230" fill="rgba(255,220,90,0.08)" stroke="rgba(255,220,90,0.5)" stroke-width="2" stroke-dasharray="8,6" rx="4"/>

  <!-- Mini goals on the left side of the zone -->
  <rect x="281" y="215" width="14" height="34" fill="url(#net)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" rx="1"/>
  <rect x="281" y="330" width="14" height="34" fill="url(#net)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" rx="1"/>

  <!-- Mini goals on the right side of the zone -->
  <rect x="525" y="215" width="14" height="34" fill="url(#net)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" rx="1"/>
  <rect x="525" y="330" width="14" height="34" fill="url(#net)" stroke="rgba(255,255,255,0.7)" stroke-width="1.5" rx="1"/>

  <!-- Title -->
  <text x="410" y="42" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="16" font-weight="700" letter-spacing="0.5">Breakout possession</text>

  <!-- Blue team (inside zone) -->
  <ellipse cx="340" cy="220" rx="11" ry="8" fill="#3b82f6" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="370" cy="290" rx="11" ry="8" fill="#3b82f6" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="330" cy="355" rx="11" ry="8" fill="#3b82f6" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="420" cy="205" rx="11" ry="8" fill="#3b82f6" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="460" cy="270" rx="11" ry="8" fill="#3b82f6" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="480" cy="375" rx="11" ry="8" fill="#3b82f6" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>

  <!-- Green team (inside zone) -->
  <ellipse cx="390" cy="245" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="325" cy="280" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="405" cy="320" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="455" cy="220" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="440" cy="350" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="495" cy="310" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>

  <!-- Outside escape players on left -->
  <ellipse cx="200" cy="230" rx="11" ry="8" fill="#3b82f6" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="180" cy="350" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>

  <!-- Outside escape players on right -->
  <ellipse cx="620" cy="235" rx="11" ry="8" fill="#22c55e" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>
  <ellipse cx="640" cy="345" rx="11" ry="8" fill="#3b82f6" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" filter="url(#s)"/>

  <!-- MicroPulse branding -->
  <text x="410" y="565" text-anchor="middle" fill="rgba(255,255,255,0.08)" font-size="32" font-weight="800" letter-spacing="6">MICROPULSE</text>
</svg>
