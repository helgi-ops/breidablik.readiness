<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="MicroPulse">
  <!--
    MicroPulse full lockup, light variant.
    Wordmark and tagline are white; pulse stays cyan.
    Use this on dark / navy backgrounds.
  -->
  <defs>
    <style>
      .dot { fill: #29B7E6; }
      .word { fill: #FFFFFF; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 96px; letter-spacing: -2px; }
      .tag  { fill: #CBD5E1; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 22px; }
    </style>
  </defs>

  <g class="dot" transform="translate(200 0)">
    <circle cx="20"  cy="120" r="5"/>
    <circle cx="36"  cy="120" r="5"/>
    <circle cx="52"  cy="120" r="5"/>
    <circle cx="68"  cy="120" r="5"/>
    <circle cx="84"  cy="120" r="5"/>
    <circle cx="100" cy="112" r="5"/>
    <circle cx="116" cy="100" r="5"/>
    <circle cx="132" cy="112" r="5"/>
    <circle cx="148" cy="120" r="5"/>
    <circle cx="164" cy="120" r="5"/>
    <circle cx="180" cy="108" r="5"/>
    <circle cx="190" cy="92"  r="5"/>
    <circle cx="196" cy="74"  r="5"/>
    <circle cx="202" cy="56"  r="5"/>
    <circle cx="208" cy="40"  r="5"/>
    <circle cx="214" cy="56"  r="5"/>
    <circle cx="220" cy="74"  r="5"/>
    <circle cx="226" cy="92"  r="5"/>
    <circle cx="232" cy="110" r="5"/>
    <circle cx="240" cy="128" r="5"/>
    <circle cx="248" cy="138" r="5"/>
    <circle cx="256" cy="128" r="5"/>
    <circle cx="264" cy="120" r="5"/>
    <circle cx="280" cy="112" r="5"/>
    <circle cx="296" cy="104" r="5"/>
    <circle cx="312" cy="112" r="5"/>
    <circle cx="328" cy="120" r="5"/>
    <circle cx="344" cy="120" r="5"/>
    <circle cx="360" cy="120" r="5"/>
    <circle cx="376" cy="120" r="5"/>
  </g>

  <text x="400" y="270" text-anchor="middle" class="word">MicroPulse</text>
  <text x="400" y="320" text-anchor="middle" class="tag">Micro inputs. Clear signals. Better decisions.</text>
</svg>
