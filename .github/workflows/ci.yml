name: CI

# Protects the readiness / load / 1RM decision engine: every push and PR runs
# the unit suite and a repo-wide type-check. These are the two signals that are
# green today, so they gate the build. Lint runs too but is non-blocking — the
# repo carries ~550 pre-existing legacy lint errors (tracked tech debt); new
# code is expected to be clean, but the legacy backlog must not wedge CI red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Next 16 requires Node >= 20.9
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (decision engine)
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      # Can one team reach another team's data? A new high finding fails the build.
      # Rules and how to handle a finding: docs/security/tenant-isolation.md
      - name: Tenant isolation audit
        run: npm run audit:tenant -- --no-db --out tenant-audit.md

      - name: Upload tenant audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tenant-audit
          path: tenant-audit.md
          if-no-files-found: ignore

      - name: Lint (non-blocking — legacy debt tracked separately)
        run: npm run lint
        continue-on-error: true
